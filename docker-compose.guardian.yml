version: '3.8'

# 19个Guardian节点网络配置

services:
  # ==========================================
  # Guardian 节点 1-19
  # ==========================================
  
  guardian-1:
    build: ./guardian
    container_name: bridge-guardian-1
    environment:
      - GUARDIAN_INDEX=0
      - GUARDIAN_PASSWORD=${GUARDIAN_PASSWORD:-dev}
      - RUST_LOG=info
    volumes:
      - ./guardian/configs/local.toml:/config/guardian.toml
      - guardian-1-data:/data
    ports:
      - "7071:7071"  # API
      - "4001:4001"  # P2P
    networks:
      - guardian-network
    depends_on:
      - anvil
    restart: unless-stopped

  guardian-2:
    build: ./guardian
    container_name: bridge-guardian-2
    environment:
      - GUARDIAN_INDEX=1
      - GUARDIAN_PASSWORD=${GUARDIAN_PASSWORD:-dev}
      - RUST_LOG=info
    volumes:
      - ./guardian/configs/local.toml:/config/guardian.toml
      - guardian-2-data:/data
    ports:
      - "7072:7071"
      - "4002:4001"
    networks:
      - guardian-network
    depends_on:
      - anvil
    restart: unless-stopped

  guardian-3:
    build: ./guardian
    container_name: bridge-guardian-3
    environment:
      - GUARDIAN_INDEX=2
