[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false
seeds = false

[programs.localnet]
solana_core = "9xd2UxwSv9qSMw3NXiFiXg4Th3oLmcYmMWe9KtRN9DHR"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 10000

