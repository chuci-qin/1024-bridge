[package]
name = "sol2svm-submitter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sol2svm-submitter"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }

tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"

solana-client = "1.17"
solana-sdk = "1.17"
spl-token = "3.5"
spl-associated-token-account = "1.1"

sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"

futures = "0.3"
