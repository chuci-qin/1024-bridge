[package]
name = "sol2svm-listener"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sol2svm-listener"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }

tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"
hex = "0.4"
bs58 = "0.5"
sha2 = "0.10"
base64 = "0.21"

solana-client = "1.17"
solana-sdk = "1.17"
solana-transaction-status = "1.17"
