[package]
name = "s2e-listener"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "s2e-listener"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }

tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1.0"
dotenvy = "0.15"

borsh = "0.10"
base64 = "0.21"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
url = "2"
futures = "0.3"
chrono = "0.4"
