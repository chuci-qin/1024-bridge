[package]
name = "bridge1024-relayer"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "relayer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "1"
hex = "0.4"
bs58 = "0.5"
sha2 = "0.10"
ethers = { version = "2", features = ["rustls"] }
solana-sdk = "2"
solana-client = "2"
solana-account-decoder = "2"
solana-transaction-status = "2"
borsh = { version = "1", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
