[package]
name = "bridge-cli"
version = "0.1.0"
edition = "2021"
description = "Cross-chain bridge CLI relayer tool"

[[bin]]
name = "bridge-cli"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Ethereum
ethers = { version = "2.0", default-features = false, features = ["rustls"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Utilities
hex = "0.4.3"
base64 = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

