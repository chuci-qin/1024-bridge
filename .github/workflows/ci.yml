name: Bridge1024 CI

on:
  push:
    branches: [main, xbx]
  pull_request:
    branches: [main, xbx]

env:
  CARGO_TERM_COLOR: always
  FOUNDRY_PROFILE: default

jobs:
  evm-tests:
    name: EVM Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        working-directory: contracts/evm
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-git
          forge install foundry-rs/forge-std --no-git
      - name: Run Forge tests
        working-directory: contracts/evm
        run: forge test -vvv
      - name: Run Forge coverage
        working-directory: contracts/evm
        run: forge coverage

  svm-tests:
    name: SVM Program Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor avm --locked --force && avm install 0.32.0 && avm use 0.32.0
      - name: Install Solana CLI & platform-tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.2.3/install)"
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          rm -f "$SOLANA_BIN/cargo"
          PT_DIR="$SOLANA_BIN/sdk/sbf/dependencies"
          rm -rf "$PT_DIR/platform-tools"
          curl -sSfL https://github.com/anza-xyz/platform-tools/releases/download/v1.52/platform-tools-linux-x86_64.tar.bz2 -o /tmp/pt.tar.bz2
          tar -xjf /tmp/pt.tar.bz2 -C "$PT_DIR"
          echo "Installed platform-tools:"
          "$PT_DIR/platform-tools/rust/bin/cargo" --version
          echo "$SOLANA_BIN" >> $GITHUB_PATH
      - name: Build SVM program
        working-directory: contracts/svm
        env:
          PLATFORM_TOOLS_VERSION: v1.52
        run: anchor build
      - name: Run SVM tests
        working-directory: contracts/svm
        env:
          PLATFORM_TOOLS_VERSION: v1.52
        run: anchor test

  relayer-tests:
    name: Relayer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            relayer/target
          key: relayer-${{ hashFiles('relayer/**/Cargo.lock') }}
      - name: Check formatting
        working-directory: relayer
        run: cargo fmt -- --check
      - name: Run clippy
        working-directory: relayer
        run: cargo clippy --workspace -- -D warnings
      - name: Run tests
        working-directory: relayer
        run: cargo test --workspace

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [relayer-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: relayer/Dockerfile
          push: false
          tags: bridge1024-relayer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
