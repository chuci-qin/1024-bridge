name: Bridge1024 CI

on:
  push:
    branches: [main, xbx]
  pull_request:
    branches: [main, xbx]

env:
  CARGO_TERM_COLOR: always
  FOUNDRY_PROFILE: default

jobs:
  # 检测哪些目录有变更，后续 job 按需跳过
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      evm: ${{ steps.filter.outputs.evm }}
      svm: ${{ steps.filter.outputs.svm }}
      relayer: ${{ steps.filter.outputs.relayer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=${{ github.event.before }}
          fi

          # 首次推送时 before 是全零，回退到 HEAD~1
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=HEAD~1
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          echo "evm=$(echo "$CHANGED" | grep -q '^contracts/evm/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "svm=$(echo "$CHANGED" | grep -q '^contracts/svm/' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "relayer=$(echo "$CHANGED" | grep -q '^relayer/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  evm-tests:
    name: EVM Contract Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.evm == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        working-directory: contracts/evm
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-git
          forge install foundry-rs/forge-std --no-git
      - name: Run Forge tests
        working-directory: contracts/evm
        run: forge test -vvv
      - name: Run Forge coverage
        working-directory: contracts/evm
        run: forge coverage --ir-minimum

  svm-tests:
    name: SVM Program Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.svm == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: svm-cargo-${{ hashFiles('contracts/svm/**/Cargo.lock') }}
      - name: Install Anchor CLI
        run: |
          which avm 2>/dev/null || cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.0
          avm use 0.32.0
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.8/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Verify toolchain
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          anchor --version
          cargo --version
          rustc --version
      - name: Setup Solana keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.ADMIN_SVM_KEYPAIR }}' > ~/.config/solana/id.json
          solana address
      - name: Install test dependencies
        working-directory: contracts/svm
        run: yarn install
      - name: Build SVM program
        working-directory: contracts/svm
        run: anchor build
      - name: Run SVM tests
        working-directory: contracts/svm
        run: anchor test --skip-build
      - name: Cleanup keypair
        if: always()
        run: rm -f ~/.config/solana/id.json

  relayer-docker:
    name: Relayer Docker Build & Push
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.relayer == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        working-directory: relayer
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f1-2)
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$SHA_SHORT" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: chuciqin1/bridge1024-relayer
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.full }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.sha }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/xbx' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: relayer
          file: relayer/Dockerfile
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
