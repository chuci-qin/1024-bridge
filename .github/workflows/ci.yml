name: Bridge1024 CI

on:
  push:
    branches: [main, xbx]
  pull_request:
    branches: [main, xbx]

env:
  CARGO_TERM_COLOR: always
  FOUNDRY_PROFILE: default

jobs:
  evm-tests:
    name: EVM Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        working-directory: contracts/evm
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-git
          forge install foundry-rs/forge-std --no-git
      - name: Run Forge tests
        working-directory: contracts/evm
        run: forge test -vvv
      - name: Run Forge coverage
        working-directory: contracts/evm
        run: forge coverage

  svm-tests:
    name: SVM Program Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: svm-cargo-${{ hashFiles('contracts/svm/**/Cargo.lock') }}
      - name: Install Anchor CLI
        run: |
          which avm 2>/dev/null || cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.0
          avm use 0.32.0
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.8/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Verify toolchain
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          anchor --version
          cargo --version
          rustc --version
      - name: Setup Solana keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.ADMIN_SVM_KEYPAIR }}' > ~/.config/solana/id.json
          solana address
      - name: Install test dependencies
        working-directory: contracts/svm
        run: yarn install
      - name: Build SVM program
        working-directory: contracts/svm
        run: anchor build
      - name: Run SVM tests
        working-directory: contracts/svm
        run: anchor test --skip-build
      - name: Cleanup keypair
        if: always()
        run: rm -f ~/.config/solana/id.json

  relayer-tests:
    name: Relayer Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            relayer/target
          key: relayer-${{ hashFiles('relayer/**/Cargo.lock') }}
      - name: Check formatting
        working-directory: relayer
        run: cargo fmt -- --check
      - name: Run clippy
        working-directory: relayer
        run: cargo clippy --workspace -- -D warnings
      - name: Run tests
        working-directory: relayer
        run: cargo test --workspace

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [relayer-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: relayer/Dockerfile
          push: false
          tags: bridge1024-relayer:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
