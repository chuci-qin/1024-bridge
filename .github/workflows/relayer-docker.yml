name: Relayer - Build & Deploy Docker

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for contract addresses (default: latest)'
        required: false
        default: 'latest'

env:
  IMAGE_NAME: chuciqin1/1024-bridge-relayer-v2

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment artifacts from latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deploy/artifacts
          # 查找最新含 deployment artifact 的 release（含 pre-release）
          RELEASE_TAG=$(gh release list --limit 20 --json tagName,assets \
            --jq '[.[] | select(.assets | length > 0)] | first | .tagName // empty')
          if [ -n "$RELEASE_TAG" ]; then
            echo "Downloading artifacts from release: $RELEASE_TAG"
            gh release download "$RELEASE_TAG" --pattern "*.json" --dir deploy/artifacts/ || true
            echo "RELEASE_TAG_RESOLVED=$RELEASE_TAG" >> $GITHUB_ENV
            ls -la deploy/artifacts/
          else
            echo "WARNING: No release with deployment artifacts found, image will rely on runtime resolution"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./relayer/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=relayer-${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      # 缓存导出单独一步，失败不阻塞构建（GitHub Cache 服务偶尔 502）
      - name: Export build cache
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./relayer/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=relayer-${{ matrix.platform }}
          cache-to: type=gha,scope=relayer-${{ matrix.platform }},mode=max
          load: false
          push: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

  deploy:
    runs-on: ubuntu-24.04
    needs: merge
    strategy:
      matrix:
        include:
          - name: relayer1
            webhook_secret: EASYPANEL_RELAYER1_DEPLOY_WEBHOOK
          - name: relayer2
            webhook_secret: EASYPANEL_RELAYER2_DEPLOY_WEBHOOK
          - name: relayer3
            webhook_secret: EASYPANEL_RELAYER3_DEPLOY_WEBHOOK
    steps:
      - name: Deploy ${{ matrix.name }} to Easypanel
        run: |
          echo "Deploying ${{ matrix.name }}..."
          curl -X GET "${{ secrets[matrix.webhook_secret] }}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 || true
          echo "${{ matrix.name }} deployment API called"
