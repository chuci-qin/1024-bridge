name: Docker Build and Push

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:  # 允许手动触发

jobs:
  build-relayer:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push Relayer Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./relayer
          file: ./relayer/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=relayer
          cache-to: type=gha,scope=relayer,mode=max
          tags: |
            chuciqin1/1024-bridge-relayer:latest
            chuciqin1/1024-bridge-relayer:${{ github.sha }}

