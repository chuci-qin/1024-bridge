[package]
name = "bridge1024"
version = "0.2.0"
description = "Unified SVM bridge program for Solana and 1024chain"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bridge1024"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
]

[dependencies]
anchor-lang = { version = "0.32", features = ["init-if-needed"] }
anchor-spl = "0.32"
solana-pubkey = "2"
hex = "0.4"
