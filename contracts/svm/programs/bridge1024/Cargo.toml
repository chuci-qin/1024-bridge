[package]
name = "bridge1024"
version = "0.2.0"
description = "Unified SVM bridge program for Solana and 1024chain"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bridge1024"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30", features = ["init-if-needed"] }
anchor-spl = "0.30"
hex = "0.4"
