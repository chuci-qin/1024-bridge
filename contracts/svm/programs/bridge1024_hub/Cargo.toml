[package]
name = "bridge1024_hub"
version = "0.3.0"
description = "Multi-peer hub SVM bridge program (deployed on 1024 chain; talks to many leaf chains)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bridge1024_hub"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
]

[dependencies]
anchor-lang = { version = "0.32", features = ["init-if-needed"] }
anchor-spl = "0.32"
solana-sha256-hasher = "2"
