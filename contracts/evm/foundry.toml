[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"

# 编译器优化
optimizer = true
optimizer_runs = 200

# 测试配置
verbosity = 3
fuzz_runs = 256

# 格式化配置
[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
multiline_func_header = "attributes_first"

# RPC endpoints
[rpc_endpoints]
localhost = "http://localhost:8545"
anvil = "http://127.0.0.1:8545"

# 以太坊账户
[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }

